<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>eyezero (i0) — Xverse Companion Wrapper (Signet Preview)</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f1012;
      --panel: #141518;
      --line: #23252a;
      --line2: #31343c;
      --ink: #ededef;
      --mut: #8b8e96;
      --ok: #30a46c;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; font-size: 13px; display: flex; flex-direction: column; }
    .bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 14px; border-bottom: 1px solid var(--line); background: var(--panel); }
    .bar-l, .bar-r { display: flex; align-items: center; gap: 8px; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; color: var(--mut); }
    button { background: #1d1f25; color: var(--ink); border: 1px solid var(--line2); border-radius: 6px; padding: 5px 10px; font-weight: 500; cursor: pointer; }
    button.primary { background: var(--ink); color: #111214; border-color: var(--ink); }
    iframe { flex: 1; width: 100%; border: 0; background: var(--bg); }
    .status { font-size: 12px; color: var(--mut); }
  </style>
</head>
<body>
  <div class="bar">
    <div class="bar-l">
      <strong>eyezero <span class="mono">wrapper · signet preview</span></strong>
      <span class="status" id="status">Pinned cross-origin Genesis Inscription iframe (Signet demo only; mainnet funding disabled)</span>
    </div>
    <div class="bar-r">
      <span class="mono" id="xverse-addr">Xverse: not connected</span>
      <button class="primary" id="connect-btn">Connect Xverse</button>
    </div>
  </div>
  <!-- Pinned immutable HTTPS document on a separate origin; no public URL query override. -->
  <iframe
    id="genesis-frame"
    src="https://app.ordstudio.app/d/aB8H6Hen95be"
    sandbox="allow-scripts allow-same-origin"
    referrerpolicy="no-referrer"
    title="eyezero Genesis Inscription"
  ></iframe>

  <script>
    const PINNED_SRC = 'https://app.ordstudio.app/d/aB8H6Hen95be';
    const TRUSTED_ORIGIN = new URL(PINNED_SRC).origin;
    const SIGNET_TAPROOT_RE = /^tb1p[qpzry9x8gf2tvdw0s3jn54khce6mua7l]{58}$/;
    const HEX64_RE = /^[0-9a-f]{64}$/;

    const frame = document.getElementById('genesis-frame');
    const statusEl = document.getElementById('status');
    const addrEl = document.getElementById('xverse-addr');

    let connected = false;
    let addrPreview = '';

    function xverseProvider() {
      return window.XverseProviders?.BitcoinProvider || window.BitcoinProvider || null;
    }

    async function connectXverse() {
      const provider = xverseProvider();
      if (!provider) {
        statusEl.textContent = 'Xverse extension not detected in this browser.';
        return;
      }
      try {
        const res = await provider.request('getAccounts', {
          purposes: ['payment', 'ordinals'],
          message: 'Connect Bitcoin wallet for eyezero Signet HTLC preview',
        });
        const list = res?.result || res?.addresses || [];
        const pay = list.find((a) => a.purpose === 'payment') || list[0];
        if (!pay?.address) throw new Error('No address returned');
        connected = true;
        addrPreview = `${pay.address.slice(0, 8)}…${pay.address.slice(-4)}`;
        addrEl.textContent = addrPreview;
        statusEl.textContent = 'Xverse connected (Signet preview — verified I0 escrow required before funding).';
        // Send only status + masked preview to the pinned origin (never broadcast full address to "*").
        frame.contentWindow?.postMessage(
          { type: 'eyezero:wrapper:ready', connected: true, network: 'signet', addrPreview },
          TRUSTED_ORIGIN,
        );
      } catch (err) {
        statusEl.textContent = `Xverse error: ${err?.message || err}`;
      }
    }

    document.getElementById('connect-btn').onclick = connectXverse;

    // Strictly authenticate source window, origin, network, and payload schema.
    window.addEventListener('message', async (ev) => {
      if (ev.source !== frame.contentWindow || ev.origin !== TRUSTED_ORIGIN) return;
      const msg = ev.data;
      if (!msg || typeof msg !== 'object') return;

      if (msg.type === 'eyezero:xverse:fundHtlc') {
        if (msg.network !== 'signet') {
          statusEl.textContent = 'Blocked funding request: only Bitcoin Signet is enabled in this preview wrapper.';
          return;
        }
        if (typeof msg.address !== 'string' || !SIGNET_TAPROOT_RE.test(msg.address)) {
          statusEl.textContent = 'Blocked funding request: invalid Signet Taproot (tb1p) address.';
          return;
        }
        if (typeof msg.swapId !== 'string' || !HEX64_RE.test(msg.swapId) || !msg.i0EscrowConfirmed) {
          statusEl.textContent = 'Blocked funding request: matching confirmed I0 escrow is required first.';
          return;
        }
        const provider = xverseProvider();
        if (!provider) {
          statusEl.textContent = `Install Xverse or send Signet BTC manually to ${msg.address}`;
          return;
        }
        try {
          const amountSats = Number(prompt(`Send how many Signet sats to verified Taproot HTLC ${msg.address}?`, '50000'));
          if (!Number.isSafeInteger(amountSats) || amountSats < 546) return;
          const res = await provider.request('sendTransfer', {
            recipients: [{ address: msg.address, amount: amountSats }],
          });
          statusEl.textContent = `Sent ${amountSats} Signet sats to HTLC (${res?.result?.txid || 'submitted'})`;
        } catch (err) {
          statusEl.textContent = `Transfer cancelled/failed: ${err?.message || err}`;
        }
      }
    });
  </script>
</body>
</html>
