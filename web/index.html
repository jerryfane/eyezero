<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>eyezero (i0) — Xverse Companion Wrapper</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f1012;
      --panel: #141518;
      --line: #23252a;
      --line2: #31343c;
      --ink: #ededef;
      --mut: #8b8e96;
      --ok: #30a46c;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; font-size: 13px; display: flex; flex-direction: column; }
    .bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 14px; border-bottom: 1px solid var(--line); background: var(--panel); }
    .bar-l, .bar-r { display: flex; align-items: center; gap: 8px; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; color: var(--mut); }
    button { background: #1d1f25; color: var(--ink); border: 1px solid var(--line2); border-radius: 6px; padding: 5px 10px; font-weight: 500; cursor: pointer; }
    button.primary { background: var(--ink); color: #111214; border-color: var(--ink); }
    iframe { flex: 1; width: 100%; border: 0; background: var(--bg); }
    .status { font-size: 12px; color: var(--mut); }
  </style>
</head>
<body>
  <div class="bar">
    <div class="bar-l">
      <strong>eyezero <span class="mono">wrapper</span></strong>
      <span class="status" id="status">Bridges Xverse + mempool.space to the immutable Genesis Inscription iframe</span>
    </div>
    <div class="bar-r">
      <span class="mono" id="xverse-addr">Xverse: not connected</span>
      <button class="primary" id="connect-btn">Connect Xverse</button>
    </div>
  </div>
  <iframe id="genesis-frame" sandbox="allow-scripts allow-same-origin" title="eyezero Genesis Inscription"></iframe>

  <script>
    const params = new URLSearchParams(location.search);
    const defaultSrc = 'https://app.ordstudio.app/d/aB8H6Hen95be';
    const frame = document.getElementById('genesis-frame');
    frame.src = params.get('src') || defaultSrc;

    let btcAddress = null;
    const statusEl = document.getElementById('status');
    const addrEl = document.getElementById('xverse-addr');

    function xverseProvider() {
      return window.XverseProviders?.BitcoinProvider || window.BitcoinProvider || null;
    }

    async function connectXverse() {
      const provider = xverseProvider();
      if (!provider) {
        statusEl.textContent = 'Xverse extension not detected in this browser.';
        return;
      }
      try {
        const res = await provider.request('getAccounts', {
          purposes: ['payment', 'ordinals'],
          message: 'Connect Bitcoin wallet for eyezero HTLC swaps',
        });
        const list = res?.result || res?.addresses || [];
        const pay = list.find((a) => a.purpose === 'payment') || list[0];
        if (!pay?.address) throw new Error('No address returned');
        btcAddress = pay.address;
        addrEl.textContent = `${btcAddress.slice(0, 10)}…${btcAddress.slice(-6)}`;
        statusEl.textContent = 'Xverse connected — 1-click BTC HTLC funding ready.';
        frame.contentWindow?.postMessage({ type: 'eyezero:wrapper:ready', btcAddress }, '*');
      } catch (err) {
        statusEl.textContent = `Xverse error: ${err?.message || err}`;
      }
    }

    document.getElementById('connect-btn').onclick = connectXverse;

    window.addEventListener('message', async (ev) => {
      const msg = ev.data;
      if (!msg || typeof msg !== 'object') return;

      if (msg.type === 'eyezero:xverse:fundHtlc') {
        const provider = xverseProvider();
        if (!provider) {
          statusEl.textContent = `Install Xverse or send BTC manually to ${msg.address}`;
          return;
        }
        try {
          const amountSats = Number(prompt(`Send how many sats to Taproot HTLC ${msg.address}?`, '50000'));
          if (!amountSats || amountSats < 546) return;
          const res = await provider.request('sendTransfer', {
            recipients: [{ address: msg.address, amount: amountSats }],
          });
          statusEl.textContent = `Sent ${amountSats} sats to HTLC (${res?.result?.txid || 'submitted'})`;
        } catch (err) {
          statusEl.textContent = `Transfer cancelled/failed: ${err?.message || err}`;
        }
      }

      if (msg.type === 'eyezero:xverse:broadcastTx' && typeof msg.txHex === 'string') {
        const apiBase = msg.network === 'signet'
          ? 'https://mempool.space/signet/api/tx'
          : 'https://mempool.space/api/tx';
        try {
          const r = await fetch(apiBase, { method: 'POST', body: msg.txHex });
          const text = await r.text();
          if (!r.ok) throw new Error(text);
          statusEl.textContent = `Broadcasted Bitcoin HTLC tx: ${text}`;
        } catch (err) {
          statusEl.textContent = `Broadcast error: ${err?.message || err}`;
        }
      }
    });
  </script>
</body>
</html>
